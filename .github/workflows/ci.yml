name: CI

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Compile scripts
        run: python -m compileall -q install.py skills/orchestrate-game-design/scripts

      - name: Smoke-test lean CLI
        run: |
          python skills/orchestrate-game-design/scripts/init_design_project.py --version
          python skills/orchestrate-game-design/scripts/create_design_artifact.py --version
          python skills/orchestrate-game-design/scripts/check_design_workspace.py --version
          python skills/orchestrate-game-design/scripts/snapshot_design_workspace.py --version
          python install.py --help
          python skills/orchestrate-game-design/scripts/init_design_project.py --help
          python skills/orchestrate-game-design/scripts/create_design_artifact.py --help
          python skills/orchestrate-game-design/scripts/create_design_artifact.py decision --help
          python skills/orchestrate-game-design/scripts/create_design_artifact.py reference --help
          python skills/orchestrate-game-design/scripts/create_design_artifact.py test --help
          python skills/orchestrate-game-design/scripts/create_design_artifact.py system --help
          python skills/orchestrate-game-design/scripts/create_design_artifact.py review --help
          python skills/orchestrate-game-design/scripts/check_design_workspace.py --help
          python skills/orchestrate-game-design/scripts/snapshot_design_workspace.py --help

      - name: Validate forward-evaluation cases
        run: python evals/validate_cases.py

      - name: Run test suite
        run: |
          python -m unittest discover -s skills/orchestrate-game-design/tests -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify an installed bundle is self-contained
        run: |
          python install.py --codex-home .ci-codex --json
          python -m unittest discover -s .ci-codex/skills/orchestrate-game-design/tests -p 'test_*.py' -v
